name: yalla_passenger
description: "Yalla - Ride & Deliver Passenger App"
publish_to: 'none'
version: 1.0.0+15

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.2.2
  dio: ^5.4.1
  socket_io_client: ^2.0.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
