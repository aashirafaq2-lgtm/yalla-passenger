workflows:
  build-release:
    name: Yalla Passenger iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Yalla Passenger
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Organize Flutter structure
        script: |
          mkdir -p assets/images
          mkdir -p lib
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi
          flutter create . --platforms=ios --org com.yalla --no-pub
      - name: Set up dependencies
        script: |
          flutter packages pub get
      - name: iOS Automatic Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.yalla.yallaPassenger" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa --release
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
